apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-score-svc
  namespace: threatsense
spec:
  replicas: 2
  selector:
    matchLabels:
      app: threat-score-svc
  template:
    metadata:
      labels:
        app: threat-score-svc
    spec:
      containers:
      - name: threat-score-svc
        image: 192.168.10.201:5000/threatsense/threat-score-svc:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "threatsense"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTERIOR_STREAM_KEY
          value: "ts:posteriors"
        - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
          value: "1"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
