apiVersion: apps/v1
kind: Deployment
metadata:
  name: mace-inference
  namespace: threatsense
spec:
  # Single replica, deliberately.
  #
  # Worker reliability lives in this process (BeliefStore) and is written to disk
  # at shutdown. Two replicas would each learn from whichever feedback they
  # happened to receive, drift apart, and then overwrite each other's file on
  # exit -- so scaling out would silently lose evidence rather than share it.
  #
  # Serving more load means either raising Mace__PoolSize (concurrency within
  # one process) or moving the belief store to shared storage that all replicas
  # read and write under a lock. The second is a code change, not a manifest
  # change.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: the old pod must release the belief-store
    # volume and finish writing before the new one starts reading it.
    type: Recreate
  selector:
    matchLabels:
      app: mace-inference
  template:
    metadata:
      labels:
        app: mace-inference
    spec:
      containers:
      - name: mace-inference
        image: 192.168.10.201:5000/threatsense/mace-inference:latest
        ports:
        # gRPC speaks HTTP/2; metrics and probes speak HTTP/1.1. Separate
        # listeners, because plaintext cannot negotiate between the two.
        - containerPort: 8080
          name: grpc
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: mace-inference-config
        env:
        # Required: .NET on Linux without the ICU package.
        - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
          value: "1"
        volumeMounts:
        # Infer.NET's MKL uses /dev/shm for shared memory buffers.
        - name: dshm
          mountPath: /dev/shm
        - name: beliefs
          mountPath: /var/lib/mace
        resources:
          requests:
            cpu: "1000m"
            memory: "512Mi"
          limits:
            cpu: "3000m"
            memory: "1Gi"
        # Both probes target the HTTP/1.1 port. A kubelet probe cannot speak
        # h2c, so pointing either at 8080 would fail on a perfectly healthy pod.
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          # The pool compiles its models during startup; until that finishes the
          # process is up but not useful.
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: beliefs
        persistentVolumeClaim:
          claimName: mace-beliefs
