apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mace-beliefs
  namespace: threatsense
spec:
  # ReadWriteOnce is sufficient because this deployment runs a single replica.
  # See the note in deployment.yaml before changing either.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
