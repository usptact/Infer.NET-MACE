---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: threatsense-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: ThreatSense Internal CA
  secretName: threatsense-ca
  duration: 87600h    # 10 years
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: threatsense-ca-issuer
spec:
  ca:
    secretName: threatsense-ca
