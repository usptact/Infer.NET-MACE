apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-console
  namespace: threatsense
spec:
  replicas: 2
  selector:
    matchLabels:
      app: operator-console
  template:
    metadata:
      labels:
        app: operator-console
    spec:
      containers:
      - name: operator-console
        image: 192.168.10.201:5000/threatsense/operator-console:latest
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: nginx-config
        configMap:
          name: operator-console-nginx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: operator-console-nginx
  namespace: threatsense
data:
  nginx.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        location /healthz { return 200 "ok"; add_header Content-Type text/plain; }
        location / { try_files $uri $uri/ /index.html; }
        gzip on;
        gzip_types text/plain text/css application/javascript application/json;
    }
