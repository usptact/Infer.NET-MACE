apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: threatsense
data:
  redis.conf: |
    # Persistence: AOF for durability (survives crash without data loss)
    appendonly yes
    appendfsync everysec
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb

    # Memory: LRU eviction for cache keys, but don't evict stream/sorted-set data
    maxmemory 768mb
    maxmemory-policy allkeys-lru

    # Performance
    hz 20
    lazyfree-lazy-expire yes

    # Streams: used as internal event bus between services
    # No explicit config needed — streams are first-class data types
