apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: threatsense
data:
  01-schema.sql: |
    -- Sensor reliability beliefs: learned θ (Beta) and φ (Dirichlet) per sensor
    CREATE TABLE IF NOT EXISTS sensor_beliefs (
        sensor_id        TEXT PRIMARY KEY,
        theta_alpha      FLOAT NOT NULL DEFAULT 1.0,
        theta_beta       FLOAT NOT NULL DEFAULT 9.0,
        phi_pseudocounts FLOAT[] NOT NULL DEFAULT '{1,1,1,1,1}',
        last_updated     TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        incidents_seen   INT NOT NULL DEFAULT 0
    );

    -- Threat incidents
    CREATE TABLE IF NOT EXISTS incidents (
        incident_id        UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        zone_id            TEXT NOT NULL,
        status             TEXT NOT NULL DEFAULT 'OPEN',  -- OPEN|ASSESSED|ESCALATED|RESOLVED
        opened_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        closed_at          TIMESTAMPTZ,
        annotation_matrix  JSONB,
        final_posteriors   JSONB,
        operator_verdict   TEXT,   -- TRUE_ALARM | FALSE_ALARM
        operator_id        TEXT
    );
    CREATE INDEX IF NOT EXISTS idx_incidents_zone_status ON incidents (zone_id, status);
    CREATE INDEX IF NOT EXISTS idx_incidents_opened_at   ON incidents (opened_at DESC);

    -- Append-only posterior snapshots (one row per inference cycle per incident)
    CREATE TABLE IF NOT EXISTS posterior_snapshots (
        snapshot_id     UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        incident_id     UUID NOT NULL REFERENCES incidents(incident_id),
        snapshot_at     TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        t_dist          FLOAT[5] NOT NULL,
        s_dist          JSONB NOT NULL,
        trigger_sensor  TEXT
    );
    CREATE INDEX IF NOT EXISTS idx_snapshots_incident ON posterior_snapshots (incident_id, snapshot_at DESC);

    -- Immutable audit log (operator actions + prior updates)
    CREATE TABLE IF NOT EXISTS audit_log (
        entry_id        UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        logged_at       TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        operator_id     TEXT NOT NULL,
        incident_id     UUID,
        action          TEXT NOT NULL,   -- FEEDBACK_SUBMITTED | PRIOR_UPDATED | INCIDENT_CREATED | ...
        payload         JSONB NOT NULL
    );
    CREATE INDEX IF NOT EXISTS idx_audit_logged_at ON audit_log (logged_at DESC);

    -- Zone configuration
    CREATE TABLE IF NOT EXISTS zones (
        zone_id                  TEXT PRIMARY KEY,
        display_name             TEXT NOT NULL,
        alert_on_level           INT NOT NULL DEFAULT 3,    -- 0-4 threshold
        confidence_min           FLOAT NOT NULL DEFAULT 0.70,
        incident_window_seconds  INT NOT NULL DEFAULT 60
    );
