---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: threatsense-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.10.200-192.168.10.210   # adjust to your network
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: threatsense-l2
  namespace: metallb-system
spec:
  ipAddressPools:
  - threatsense-pool
