syntax = "proto3";

package mace;

option csharp_namespace = "MACE.Protos";

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service MaceInference {
  // Hot path: run VMP inference for a single active incident.
  // Priors and sensor readings arrive per-request; pod is fully stateless.
  rpc Infer (InferRequest) returns (InferResponse);

  // Cold path: compute updated θ (Beta) and φ (Dirichlet) priors after an
  // operator verdict. Pure arithmetic — does not use Infer.NET. Implements the
  // single-incident EM step of the MACE model (see PriorUpdateService).
  rpc UpdatePriors (UpdatePriorsRequest) returns (UpdatePriorsResponse);

  // Kubernetes liveness / readiness probe.
  rpc Health (HealthRequest) returns (HealthResponse);
}

// ---------------------------------------------------------------------------
// Infer
// ---------------------------------------------------------------------------

message BetaParams {
  double alpha = 1;
  double beta  = 2;
}

message DirichletParams {
  repeated double pseudocounts = 1;   // length == NumThreatLevels
}

message InferRequest {
  string  incident_id = 1;

  // Discretized sensor readings for this incident.
  // Length must equal NumSensorTypes (server config).
  // -1 = sensor absent / did not observe this incident.
  repeated int32 sensor_readings = 2;

  // Current θ prior (Beta) for each sensor type, indexed by sensor-type order.
  repeated BetaParams    theta_priors = 3;

  // Current φ prior (Dirichlet) for each sensor type.
  repeated DirichletParams phi_priors = 4;

  // Optional warm-start: threat_dist probabilities from a previous Infer
  // call on the same incident. Omit (leave empty) on the first call.
  // When provided, VMP initialises from this distribution and converges faster.
  repeated double warm_start = 5;
}

message SensorReliability {
  int32  sensor_type_index = 1;
  int32  sensor_reading    = 2;
  double fault_prob        = 3;   // mean of S[0][j] fault indicator posterior
  double reliability       = 4;   // 1 - fault_prob
}

message InferResponse {
  string incident_id = 1;

  // Full posterior distribution over threat levels: P(CLEAR..CRITICAL | evidence).
  // Length == NumThreatLevels.
  repeated double threat_dist = 2;

  int32  threat_level    = 3;   // argmax(threat_dist)
  double confidence      = 4;   // max(threat_dist)
  double entropy         = 5;   // Shannon entropy of threat_dist (uncertainty measure)

  // Only sensors that contributed a reading (sensor_reading != -1).
  repeated SensorReliability sensor_reliability = 6;

  int32 num_observations = 7;   // count of non-(-1) sensor readings
  int64 inference_ms     = 8;   // VMP wall-clock time in milliseconds
}

// ---------------------------------------------------------------------------
// UpdatePriors
// ---------------------------------------------------------------------------

message SensorPriorUpdate {
  int32     sensor_type_index  = 1;
  int32     sensor_reading     = 2;   // -1 if absent
  // DEPRECATED: no longer used by the EM update, which recomputes the fault
  // responsibility from the gold true level. Retained for wire compatibility
  // and diagnostic logging.
  double    fault_prob_mean    = 3;
  BetaParams      current_theta = 4;   // current θ (Beta) prior for this sensor type
  DirichletParams current_phi   = 5;   // current φ (Dirichlet) prior for this sensor type
}

message UpdatePriorsRequest {
  string verdict      = 1;   // "TRUE_ALARM" or "FALSE_ALARM"
  double learning_rate = 2;
  repeated SensorPriorUpdate sensors = 3;
  // Operator-resolved gold threat level for the closed incident, used to
  // recompute each sensor's fault responsibility. Interpreted only when
  // verdict == "TRUE_ALARM"; a "FALSE_ALARM" verdict pins the gold level to
  // CLEAR (0) regardless of this field. Range: [0, NumThreatLevels).
  int32  true_threat_level = 4;
}

message UpdatedTheta {
  int32  sensor_type_index = 1;
  double alpha             = 2;
  double beta              = 3;
}

message UpdatedPhi {
  int32  sensor_type_index    = 1;
  repeated double pseudocounts = 2;   // length == NumThreatLevels
}

message UpdatePriorsResponse {
  repeated UpdatedTheta updated_thetas = 1;
  repeated UpdatedPhi   updated_phis   = 2;
}

// ---------------------------------------------------------------------------
// Health
// ---------------------------------------------------------------------------

message HealthRequest {}

message HealthResponse {
  string status          = 1;   // "healthy" or "degraded"
  int32  pool_available  = 2;
  int32  pool_total      = 3;
  int64  uptime_seconds  = 4;
}
